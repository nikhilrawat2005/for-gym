<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="forgeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff784e"/>
      <stop offset="100%" stop-color="#ff3d00"/>
    </linearGradient>
    <linearGradient id="darkGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1e222b"/>
      <stop offset="100%" stop-color="#0c0d10"/>
    </linearGradient>
  </defs>

  <!-- Background rounded squircle -->
  <rect width="64" height="64" rx="16" fill="url(#darkGrad)"/>
  <rect width="62" height="62" x="1" y="1" rx="15" fill="none" stroke="rgba(255,255,255,0.12)" stroke-width="1.5"/>

  <!-- Stylized FORGE Dumbbell Icon in Ember Gradient -->
  <!-- Left Weight Outer -->
  <rect x="12" y="21" width="5" height="22" rx="2" fill="url(#forgeGrad)"/>
  <!-- Left Weight Inner -->
  <rect x="19" y="24" width="4" height="16" rx="1.5" fill="url(#forgeGrad)"/>
  
  <!-- Barbell Central Shaft -->
  <rect x="23" y="29" width="18" height="6" rx="2" fill="#f8fafc"/>

  <!-- Right Weight Inner -->
  <rect x="41" y="24" width="4" height="16" rx="1.5" fill="url(#forgeGrad)"/>
  <!-- Right Weight Outer -->
  <rect x="47" y="21" width="5" height="22" rx="2" fill="url(#forgeGrad)"/>

  <!-- Forge Spark / Flame Accent -->
  <path d="M32 13 C33.8 17 37 19.5 37 22.5 C37 25.2 34.8 27 32 27 C29.2 27 27 25.2 27 22.5 C27 20 29.5 18 32 13 Z" fill="#ffb238"/>
  <circle cx="32" cy="23" r="1.5" fill="#ffffff"/>
</svg>
